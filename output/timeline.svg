<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="358" viewBox="0 0 1000 358"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="commit_history">
  <style>
    text { font-family: -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    .mono { font-family: 'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace; }

    .in    { opacity: 0; animation: rise .6s cubic-bezier(.22,1,.36,1) forwards; }
    .fade  { opacity: 0; animation: fade .8s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); }
                      to   { opacity: 1; transform: translateY(0); } }
    @keyframes fade { to { opacity: 1; } }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }

    .pulse { transform-origin: center; transform-box: fill-box;
             animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .9; } 50% { opacity: .35; } }

    .sheen { animation: sweep 9s ease-in-out infinite; }
    @keyframes sweep { 0%, 55% { transform: translateX(-1100px); }
                       85%, 100% { transform: translateX(1100px); } }

    .frame-in { opacity: 0; transform-origin: center; transform-box: fill-box;
                animation: frame .9s cubic-bezier(.22,1,.36,1) .5s forwards; }
    @keyframes frame { from { opacity: 0; transform: scale(.975) translateY(6px); }
                       to   { opacity: 1; transform: scale(1) translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .in, .fade, .frame-in { animation: none; opacity: 1; }
      .sheen { animation: none; opacity: 0; }
    }
    </style>
  <defs>
    <linearGradient id="bglog" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#060A08"/>
      <stop offset="1" stop-color="#030504"/>
    </linearGradient>
    <radialGradient id="gllog" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#2FD07B" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#2FD07B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cplog"><rect width="1000" height="358" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#cplog)">
    <rect width="1000" height="358" fill="url(#bglog)"/>
    <rect width="1000" height="358" fill="url(#gllog)"/>
    <text class="mono" x="30" y="27.5" font-size="12" letter-spacing="1.5"
          fill="#87998F"><tspan fill="#2FD07B">&#9656;</tspan>  commit_history</text>
    <text class="mono" x="970" y="27.5" text-anchor="end"
          font-size="11.5" fill="#4C5A53">log --reverse</text>
    <line x1="0" y1="46" x2="1000" y2="46" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <line class="fade" style="animation-delay:.3s" x1="64" y1="96" x2="64" y2="270" stroke="#FFFFFF" stroke-opacity="0.12"/><g class="in" style="animation-delay:0.35s"><circle cx="64" cy="92" r="3.5" fill="#2FD07B" fill-opacity="0.8"/><circle cx="64" cy="92" r="3.5" fill="none" stroke="#060A08" stroke-width="1"/><text class="mono" x="92" y="96" font-size="11.5" letter-spacing="1" fill="#2FD07B" fill-opacity="0.85">[2025]</text><text x="164" y="96.5" font-size="14.5" font-weight="600" fill="#87998F">first conversations</text><text x="164" y="117" font-size="12.5" fill="#4C5A53">three chatbots in a row — the app, the api, the interface</text></g><g class="in" style="animation-delay:0.51s"><circle cx="64" cy="150" r="3.5" fill="#2FD07B" fill-opacity="0.8"/><circle cx="64" cy="150" r="3.5" fill="none" stroke="#060A08" stroke-width="1"/><text class="mono" x="92" y="154" font-size="11.5" letter-spacing="1" fill="#2FD07B" fill-opacity="0.85">[2025]</text><text x="164" y="154.5" font-size="14.5" font-weight="600" fill="#87998F">the model era</text><text x="164" y="175" font-size="12.5" fill="#4C5A53">loan prediction and movie recommendations, learning to trust data</text></g><g class="in" style="animation-delay:0.67s"><circle cx="64" cy="208" r="3.5" fill="#2FD07B" fill-opacity="0.8"/><circle cx="64" cy="208" r="3.5" fill="none" stroke="#060A08" stroke-width="1"/><text class="mono" x="92" y="212" font-size="11.5" letter-spacing="1" fill="#2FD07B" fill-opacity="0.85">[2026]</text><text x="164" y="212.5" font-size="14.5" font-weight="600" fill="#87998F">shipping products</text><text x="164" y="233" font-size="12.5" fill="#4C5A53">fit-365 — a fitness app people could actually open</text></g><g class="in" style="animation-delay:0.83s"><circle class="pulse" cx="64" cy="266" r="4.5" fill="#7BE38F"/><circle cx="64" cy="266" r="9" fill="#7BE38F" opacity="0.15"/><text class="mono" x="92" y="270" font-size="11.5" letter-spacing="1" fill="#2FD07B" fill-opacity="0.85">[now]</text><text x="164" y="270.5" font-size="14.5" font-weight="600" fill="#E9F3EC">full stack</text><text x="164" y="291" font-size="12.5" fill="#4C5A53">insurance management in java, and this operating system</text></g>
    
  </g>
  <rect x="0.5" y="0.5" width="999" height="357" rx="21.5"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
</svg>