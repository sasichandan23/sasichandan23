      <stop offset="0" stop-color="#060A08"/>
      <stop offset="1" stop-color="#030504"/>
    </linearGradient>
    <radialGradient id="glpkg" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#2FD07B" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#2FD07B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cppkg"><rect width="1000" height="356" rx="22"/></clipPath>
  </defs>
