<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="220" viewBox="0 0 1000 220"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="environment">
  <style>
    text { font-family: -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    .mono { font-family: 'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace; }

    .in    { opacity: 0; animation: rise .6s cubic-bezier(.22,1,.36,1) forwards; }
    .fade  { opacity: 0; animation: fade .8s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); }
                      to   { opacity: 1; transform: translateY(0); } }
    @keyframes fade { to { opacity: 1; } }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }

    .pulse { transform-origin: center; transform-box: fill-box;
             animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .9; } 50% { opacity: .35; } }

    .sheen { animation: sweep 9s ease-in-out infinite; }
    @keyframes sweep { 0%, 55% { transform: translateX(-1100px); }
                       85%, 100% { transform: translateX(1100px); } }

    .frame-in { opacity: 0; transform-origin: center; transform-box: fill-box;
                animation: frame .9s cubic-bezier(.22,1,.36,1) .5s forwards; }
    @keyframes frame { from { opacity: 0; transform: scale(.975) translateY(6px); }
                       to   { opacity: 1; transform: scale(1) translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .in, .fade, .frame-in { animation: none; opacity: 1; }
      .sheen { animation: none; opacity: 0; }
    }
    </style>
  <defs>
    <linearGradient id="bgsys" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#060A08"/>
      <stop offset="1" stop-color="#030504"/>
    </linearGradient>
    <radialGradient id="glsys" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#2FD07B" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#2FD07B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cpsys"><rect width="1000" height="220" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#cpsys)">
    <rect width="1000" height="220" fill="url(#bgsys)"/>
    <rect width="1000" height="220" fill="url(#glsys)"/>
    <text class="mono" x="30" y="27.5" font-size="12" letter-spacing="1.5"
          fill="#87998F"><tspan fill="#2FD07B">&#9656;</tspan>  environment</text>
    <text class="mono" x="970" y="27.5" text-anchor="end"
          font-size="11.5" fill="#4C5A53">printenv</text>
    <line x1="0" y1="46" x2="1000" y2="46" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <g class="in" style="animation-delay:0.20s"><text class="mono" x="44" y="96" font-size="12" letter-spacing="1" fill="#2FD07B" fill-opacity="0.8">machine</text><text class="mono" x="140" y="96" font-size="12.5" fill="#87998F">windows 11</text></g><g class="in" style="animation-delay:0.28s"><text class="mono" x="44" y="126" font-size="12" letter-spacing="1" fill="#2FD07B" fill-opacity="0.8">editor</text><text class="mono" x="140" y="126" font-size="12.5" fill="#87998F">vs code</text></g><g class="in" style="animation-delay:0.36s"><text class="mono" x="44" y="156" font-size="12" letter-spacing="1" fill="#2FD07B" fill-opacity="0.8">shell</text><text class="mono" x="140" y="156" font-size="12.5" fill="#87998F">powershell</text></g><g class="in" style="animation-delay:0.44s"><text class="mono" x="524" y="96" font-size="12" letter-spacing="1" fill="#2FD07B" fill-opacity="0.8">theme</text><text class="mono" x="620" y="96" font-size="12.5" fill="#87998F">black on green</text></g><g class="in" style="animation-delay:0.52s"><text class="mono" x="524" y="126" font-size="12" letter-spacing="1" fill="#2FD07B" fill-opacity="0.8">fuel</text><text class="mono" x="620" y="126" font-size="12.5" fill="#87998F">chai</text></g><g class="in" style="animation-delay:0.60s"><text class="mono" x="524" y="156" font-size="12" letter-spacing="1" fill="#2FD07B" fill-opacity="0.8">uptime</text><text class="mono" x="620" y="156" font-size="12.5" fill="#87998F">building since 2025</text></g>
    
  </g>
  <rect x="0.5" y="0.5" width="999" height="219" rx="21.5"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
</svg>