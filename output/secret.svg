<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="218" viewBox="0 0 1000 218"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="hidden_layer">
  <style>
    text { font-family: -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    .mono { font-family: 'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace; }

    .in    { opacity: 0; animation: rise .6s cubic-bezier(.22,1,.36,1) forwards; }
    .fade  { opacity: 0; animation: fade .8s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); }
                      to   { opacity: 1; transform: translateY(0); } }
    @keyframes fade { to { opacity: 1; } }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }

    .pulse { transform-origin: center; transform-box: fill-box;
             animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .9; } 50% { opacity: .35; } }

    .sheen { animation: sweep 9s ease-in-out infinite; }
    @keyframes sweep { 0%, 55% { transform: translateX(-1100px); }
                       85%, 100% { transform: translateX(1100px); } }

    .frame-in { opacity: 0; transform-origin: center; transform-box: fill-box;
                animation: frame .9s cubic-bezier(.22,1,.36,1) .5s forwards; }
    @keyframes frame { from { opacity: 0; transform: scale(.975) translateY(6px); }
                       to   { opacity: 1; transform: scale(1) translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .in, .fade, .frame-in { animation: none; opacity: 1; }
      .sheen { animation: none; opacity: 0; }
    }
    </style>
  <defs>
    <linearGradient id="bgsec" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#060A08"/>
      <stop offset="1" stop-color="#030504"/>
    </linearGradient>
    <radialGradient id="glsec" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#2FD07B" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#2FD07B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cpsec"><rect width="1000" height="218" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#cpsec)">
    <rect width="1000" height="218" fill="url(#bgsec)"/>
    <rect width="1000" height="218" fill="url(#glsec)"/>
    <text class="mono" x="30" y="27.5" font-size="12" letter-spacing="1.5"
          fill="#87998F"><tspan fill="#2FD07B">&#9656;</tspan>  hidden_layer</text>
    <text class="mono" x="970" y="27.5" text-anchor="end"
          font-size="11.5" fill="#4C5A53">cat .env</text>
    <line x1="0" y1="46" x2="1000" y2="46" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text class="in mono" style="animation-delay:.15s" x="44" y="86" font-size="11.5" letter-spacing="1.5" fill="#4C5A53">&#9656; you went looking. good instinct.</text><text class="in" style="animation-delay:0.30s" x="44" y="122" font-size="15" font-style="italic" fill="#E9F3EC">My first chatbot only knew three sentences. I was still proud</text><text class="in" style="animation-delay:0.42s" x="44" y="147" font-size="15" font-style="italic" fill="#E9F3EC">of it.</text><g class="in" style="animation-delay:.75s"><text class="mono" x="44" y="190" font-size="11" fill="#4C5A53">a different line loads tomorrow</text><rect class="cursor" x="257" y="180" width="7" height="13" rx="1.5" fill="#2FD07B"/></g>
    
  </g>
  <rect x="0.5" y="0.5" width="999" height="217" rx="21.5"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
</svg>