<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="434" viewBox="0 0 1000 434"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="profile.md">
  <style>
    text { font-family: -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    .mono { font-family: 'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace; }

    .in    { opacity: 0; animation: rise .6s cubic-bezier(.22,1,.36,1) forwards; }
    .fade  { opacity: 0; animation: fade .8s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); }
                      to   { opacity: 1; transform: translateY(0); } }
    @keyframes fade { to { opacity: 1; } }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }

    .pulse { transform-origin: center; transform-box: fill-box;
             animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .9; } 50% { opacity: .35; } }

    .sheen { animation: sweep 9s ease-in-out infinite; }
    @keyframes sweep { 0%, 55% { transform: translateX(-1100px); }
                       85%, 100% { transform: translateX(1100px); } }

    .frame-in { opacity: 0; transform-origin: center; transform-box: fill-box;
                animation: frame .9s cubic-bezier(.22,1,.36,1) .5s forwards; }
    @keyframes frame { from { opacity: 0; transform: scale(.975) translateY(6px); }
                       to   { opacity: 1; transform: scale(1) translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      .in, .fade, .frame-in { animation: none; opacity: 1; }
      .sheen { animation: none; opacity: 0; }
    }
    </style>
  <defs>
    <linearGradient id="bgman" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#060A08"/>
      <stop offset="1" stop-color="#030504"/>
    </linearGradient>
    <radialGradient id="glman" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#2FD07B" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#2FD07B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cpman"><rect width="1000" height="434" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#cpman)">
    <rect width="1000" height="434" fill="url(#bgman)"/>
    <rect width="1000" height="434" fill="url(#glman)"/>
    <text class="mono" x="30" y="27.5" font-size="12" letter-spacing="1.5"
          fill="#87998F"><tspan fill="#2FD07B">&#9656;</tspan>  profile.md</text>
    <text class="mono" x="970" y="27.5" text-anchor="end"
          font-size="11.5" fill="#4C5A53">cat(1)</text>
    <line x1="0" y1="46" x2="1000" y2="46" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <text class="in mono" style="animation-delay:0.20s" x="44" y="92" font-size="11.5" font-weight="700" letter-spacing="2" fill="#2FD07B">NAME</text><text class="in mono" style="animation-delay:0.30s" x="88" y="116" font-size="12.5" fill="#87998F">sasi — student, model wrangler, backend builder</text><text class="in mono" style="animation-delay:0.36s" x="44" y="153" font-size="11.5" font-weight="700" letter-spacing="2" fill="#2FD07B">SYNOPSIS</text><text class="in mono" style="animation-delay:0.46s" x="88" y="177" font-size="12.5" fill="#87998F">sasi [--train] [--test] [--ship] &lt;idea&gt;</text><text class="in mono" style="animation-delay:0.52s" x="44" y="214" font-size="11.5" font-weight="700" letter-spacing="2" fill="#2FD07B">DESCRIPTION</text><text class="in mono" style="animation-delay:0.62s" x="88" y="238" font-size="12.5" fill="#87998F">Started with chatbots, moved to models, ended up building</text><text class="in mono" style="animation-delay:0.68s" x="88" y="259" font-size="12.5" fill="#87998F">the whole system around them. Prefers a project that runs</text><text class="in mono" style="animation-delay:0.74s" x="88" y="280" font-size="12.5" fill="#87998F">over a project that only demos.</text><text class="in mono" style="animation-delay:0.80s" x="44" y="317" font-size="11.5" font-weight="700" letter-spacing="2" fill="#2FD07B">PHILOSOPHY</text><text class="in mono" style="animation-delay:0.90s" x="88" y="341" font-size="12.5" fill="#87998F">1.  A model is a guess with better manners.</text><text class="in mono" style="animation-delay:0.96s" x="88" y="362" font-size="12.5" fill="#87998F">2.  Build the boring part first — it is the part that breaks.</text><text class="in mono" style="animation-delay:1.02s" x="88" y="383" font-size="12.5" fill="#87998F">3.  Learn in public, ship in private, repeat.</text>
    
  </g>
  <rect x="0.5" y="0.5" width="999" height="433" rx="21.5"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
</svg>