ill="#0D1410" stroke="#2FD07B" stroke-opacity="0.22"/><text class="mono" x="398.0" y="189" text-anchor="middle" font-size="10.5" fill="#87998F">Java</text></g><g class="in" style="animation-delay:1.29s"><rect x="434" y="173" width="58" height="24" rx="12" fill="#0D1410" stroke="#2FD07B" stroke-opacity="0.22"/><text class="mono" x="463.0" y="189" text-anchor="middle" font-size="10.5" fill="#87998F">MySQL</text></g><text class="in mono" style="animation-delay:1.45s" x="372" y="228" font-size="11" letter-spacing="0.5" fill="#4C5A53">type: java   ·   since 2026   ·   ★ 0</text>
